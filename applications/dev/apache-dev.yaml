apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-dev
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: test-ns
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  sources:
    - repoURL: 'https://github.com/hippo-an/argo_app_of_apps_arch.git'
      ref: values
    - repoURL: 'https://charts.bitnami.com/bitnami'
      targetRevision: 9.1.16 # 9.1.16 9.1.17
      chart: apache
      helm:
        valueFiles:
          - $values/image-values/dev/apache-dev-image-values.yaml
          - $values/additional-values/dev/apache-dev-additional-values.yaml
