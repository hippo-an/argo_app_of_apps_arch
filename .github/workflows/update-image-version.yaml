name: "[test] update image version"

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: 'choose deployment environments'
        default: dev
        options:
          - dev
          - staging
          - prod
        required: true
      application:
        type: choice
        description: 'choose deployment application'
        default: nginx
        options:
          - apache
          - nginx
        required: true
      image_version:
        description: 'update image version'
        required: true
          
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  ENV: ${{ inputs.env }}
  APPLICATION: ${{ inputs.application }}
  IMAGE_VERSION: ${{ inputs.image_version }}

jobs:
  update-image-version:
    name: 'Update Image Version'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: hippo-an/argo_app_of_apps_arch
          ref: main
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      
      - name: yq 설치
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      
      - name: 현재 이미지 버전 가져오기
        id: get-current
        run: |
          FILE=image-values/${{ env.ENV }}/${{ env.APPLICATION }}-${{ env.ENV }}-image-values.yaml
          if [ ! -f "$FILE" ]; then
            echo "파일이 존재하지 않습니다: $FILE"
            exit 1
          fi

          CURRENT_VERSION=$(yq '.image.tag' "$FILE")
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: 시맨틱 버전 증가 여부 확인
        run: |
          CURRENT=${{ steps.get-current.outputs.current_version }}
          NEW=${{ env.IMAGE_VERSION }}

          echo "현재 버전: $CURRENT"
          echo "새 버전: $NEW"

          if [[ ! $NEW =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "semver 형식이 아닙니다: $NEW"
            exit 1
          fi

          compare_versions() {
            [ "$1" = "$2" ] && return 1
            local IFS=.
            local i ver1=($1) ver2=($2)
            for ((i=0; i<${#ver1[@]}; i++)); do
              if [[ -z ${ver2[i]} ]]; then
                return 1
              fi
              if ((10#${ver1[i]} < 10#${ver2[i]})); then
                return 0
              elif ((10#${ver1[i]} > 10#${ver2[i]})); then
                return 1
              fi
            done
            return 1
          }

          if compare_versions "$CURRENT" "$NEW"; then
            echo "버전이 올바르게 증가했습니다."
          else
            echo "버전이 이전보다 크지 않습니다."
            exit 1
          fi

      - name: 이미지 버전 업데이트
        run: |
          FILE=image-values/${{ github.event.inputs.env }}/${{ github.event.inputs.application }}-${{ github.event.inputs.env }}-image-values.yaml
          yq -i '.image.tag = "${{ env.IMAGE_VERSION }}"' "$FILE"

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add image-values/${{ github.event.inputs.env }}/${{ github.event.inputs.application }}-${{ github.event.inputs.env }}-image-values.yaml
          git commit -m "Update ${{ github.event.inputs.application }} image version to ${{ github.event.inputs.image_version }} in ${{ github.event.inputs.env }}"
          git push